# Phase 1: vendor registration, driven on a real device or emulator.
#
# Uses the same testIDs as the web acceptance run, so this exercises the same
# elements a user touches rather than a parallel test-only path.
#
# Run:  maestro test maestro/phase1-vendor-registration.yaml
appId: com.platform.app
---
- launchApp:
    clearState: true

# The emulator runs on software GPU alongside the dev servers, so Android
# itself occasionally throws a "System UI isn't responding" dialog over the
# app. It is an emulator resourcing artefact, nothing to do with the app, but
# it swallows taps, so it is dismissed if present.
- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"

# ── Login screen ────────────────────────────────────────────────────────────
# The JS bundle has to parse and Firebase has to initialise before anything
# renders, which takes noticeably longer on a cold native start than in the web
# preview. Waiting for the screen rather than asserting immediately.
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 150000
- assertVisible: "Log in"
# The placeholder social buttons are hidden until the providers are real, so
# neither should be on screen. A control that fabricates an account is worse
# than no control.
- assertNotVisible: "Continue with Apple"
- assertNotVisible: "Continue with Google"
- takeScreenshot: evidence/android/01-login

# ── Choose account type ─────────────────────────────────────────────────────
- tapOn: "Create an account"
- assertVisible: "Vendor"
- takeScreenshot: evidence/android/02-choose-account-type

- tapOn:
    id: "role-vendor-card"
- tapOn:
    id: "role-continue-button"

# ── Registration form: seven fields, nothing more ───────────────────────────
- assertVisible: "Create your vendor account"
# Business name, category and description are deliberately collected later
# through the dashboard checklist, not at signup.
- assertNotVisible: "Business Name"
- assertNotVisible: "Category"
- takeScreenshot: evidence/android/03-registration-seven-fields

# A fresh address each run, so the flow never trips over "account already
# exists" from the previous one. Maestro evaluates JS inside ${}.
- evalScript: ${output.email = 'maestro.vendor.' + Date.now() + '@theplatform.test'}

# The keyboard is dismissed between fields. On a phone it covers the lower half
# of the form, so the next input is genuinely off-screen rather than just
# obscured, and a tap lands on the keyboard instead.
- tapOn:
    id: "vendor-firstname"
- inputText: "Ada"
- hideKeyboard
- tapOn:
    id: "vendor-lastname"
- inputText: "Obi"
- hideKeyboard
- tapOn:
    id: "vendor-email"
- inputText: ${output.email}
- hideKeyboard
- tapOn:
    id: "vendor-phone"
- inputText: "+2348012345678"
- hideKeyboard
- tapOn:
    id: "vendor-password"
- inputText: "DemoPass123!"
- hideKeyboard
- takeScreenshot: evidence/android/04-registration-filled

# Password visibility, matching the customer screen.
- tapOn:
    id: "vendor-password-toggle"
- takeScreenshot: evidence/android/05-password-visible
- tapOn:
    id: "vendor-password-toggle"

# ── Country only. State and area are not asked for at signup. ───────────────
- tapOn:
    id: "vendor-country"
- assertVisible: "Nigeria"
- takeScreenshot: evidence/android/06-country-picker
- tapOn: "Nigeria"
# No hideKeyboard here. On Android Maestro implements it as a BACK key press,
# and selecting from the country modal leaves no keyboard open, so the press
# fell through to navigation and took the flow out of the form entirely. The
# screenshots looked like a scrolling problem; the flow had already left the
# screen before the scroll ran.
- takeScreenshot: evidence/android/07-country-selected

# ── Legal consent sits above the button, three separate documents ───────────
# Plain scrolls rather than scrollUntilVisible. On Android 14 with gesture
# navigation, Maestro's scroll-until-visible swipes from near the screen edge,
# which Android interprets as the system back gesture: the flow navigated
# backwards out of the form instead of scrolling it.
- scroll
- scroll

# Regex rather than exact text. Each document name is its own tappable Text
# inside one sentence, so the node Maestro sees carries the whole sentence and
# an exact match on the fragment never hits.
- assertVisible: ".*Terms of Use.*"
- assertVisible: ".*Privacy Policy.*"
- assertVisible: ".*Vendor Agreement.*"
- takeScreenshot: evidence/android/08-legal-consent

# ── Create the account ──────────────────────────────────────────────────────
- tapOn:
    id: "vendor-create-account"
# Registration is three round trips: Firebase Auth creates the user, the
# onUserCreate trigger writes users/{uid}, then completeRegistration runs. On a
# software-GPU emulator with cold Cloud Functions that is far slower than the
# browser, so the wait is generous rather than tuned to a fast machine.
- extendedWaitUntil:
    visible: "Storefront setup"
    timeout: 150000
- takeScreenshot: evidence/android/09-dashboard

# ── Criterion 6: nothing on this dashboard belongs to another vendor ────────
- assertVisible: "0"
- assertNotVisible: "3 new customers this week"
- assertNotVisible: "Average reply time"
- scroll
- takeScreenshot: evidence/android/10-setup-checklist
- scroll
- takeScreenshot: evidence/android/11-checklist-continued
